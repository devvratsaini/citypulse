name: CityPulse CI Pipeline

# This workflow runs on any push or pull request to the 'main' branch
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    # The main job that performs all our checks and builds
    build-and-push:
        runs-on: ubuntu-latest # Use a standard Linux environment

        steps:
            # Step 1: Get the code from the repository
            - name: Checkout Repository
              uses: actions/checkout@v3

            # Step 2: Set up the Node.js environment
            - name: Set up Node.js 18
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
                  cache: "npm" # Cache dependencies for faster subsequent runs

            # Step 3: Install all project dependencies
            - name: Install Dependencies
              run: npm install

            # Step 4: Security Scans (Fail the build if issues are found)
            - name: Run Linting (SAST)
              run: npm run lint
            - name: Run Dependency Vulnerability Scan (SCA)
              run: npm audit --audit-level=high

            # Step 5: Log in to Docker Hub using the configured secrets
            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Step 6: Build the Docker image and push it to Docker Hub
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v4
              with:
                  context: . # Use the current directory as the build context
                  push: true # Actually push the image after building
                  # Tag the image with 'latest' and the unique Git commit hash
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/urbanpulse:latest, ${{ secrets.DOCKERHUB_USERNAME }}/urbanpulse:${{ github.sha }}
                  # Pass the API key to the Dockerfile's ARG
                  build-args: |
                      NEXT_PUBLIC_ORS_API_KEY=${{ secrets.NEXT_PUBLIC_ORS_API_KEY }}
